<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Finger-Chooser</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finger-Chooser">
<meta name="theme-color" content="#0a0918">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg1:#f4f1ff; --bg2:#dfe7ff; --text:#1d1b3a; --muted:#6b6890; --glow:#7c5cff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#14122b; --bg2:#0a0918; --text:#f3f1ff; --muted:#9b97c4; --glow:#8b6cff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg1:#14122b; --bg2:#0a0918; --text:#f3f1ff; --muted:#9b97c4; --glow:#8b6cff; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
body{
  margin:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg2);color:var(--text);
}
#stage{
  position:fixed;inset:0;touch-action:none;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%, var(--bg1), transparent 70%),
    radial-gradient(90% 60% at 50% 100%, color-mix(in srgb, var(--glow) 25%, transparent), transparent 70%),
    var(--bg2);
  transition:background .5s;
}
#stage.done{
  background:
    radial-gradient(90% 70% at var(--wx,50%) var(--wy,50%), color-mix(in srgb, var(--wc,var(--glow)) 45%, transparent), transparent 70%),
    var(--bg2);
}
#center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;pointer-events:none;transition:opacity .4s, transform .4s;
}
#center.hide{opacity:0;transform:scale(.96)}
.icon{
  width:88px;height:88px;border-radius:50%;margin-bottom:28px;
  background:conic-gradient(from 0deg,#ff5d8f,#ffb347,#4be3a1,#4bb8ff,#8b6cff,#ff5d8f);
  display:grid;place-items:center;animation:spin 8s linear infinite;
  box-shadow:0 10px 40px color-mix(in srgb,var(--glow) 40%,transparent);
}
.icon::after{content:"";width:68px;height:68px;border-radius:50%;background:var(--bg1)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{margin:0 0 10px;font-size:30px;font-weight:700;letter-spacing:-.02em}
p{margin:0;color:var(--muted);font-size:17px;line-height:1.4;max-width:280px}
#status{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 28px);
  text-align:center;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);opacity:0;transition:opacity .3s;pointer-events:none;
}
#status.show{opacity:1}
#count{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);
  text-align:center;font-size:72px;font-weight:800;letter-spacing:-.04em;
  opacity:0;transition:opacity .25s;pointer-events:none;font-variant-numeric:tabular-nums;
}
#count.show{opacity:.9}
.touch{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.dot{
  position:absolute;left:-48px;top:-48px;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 60%,#fff), var(--c));
  box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent),0 12px 40px color-mix(in srgb,var(--c) 70%,transparent);
  animation:pop .35s cubic-bezier(.2,1.6,.4,1) both;
  transition:transform .6s cubic-bezier(.2,.9,.3,1.2), opacity .5s;
}
.dot::after{
  content:"";position:absolute;inset:-18px;border-radius:50%;
  border:3px solid var(--c);opacity:.7;animation:pulse 1.4s ease-out infinite;
}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.touch.lose .dot{transform:scale(0);opacity:0}
.touch.win .dot{transform:scale(2.1);animation:none;
  box-shadow:0 0 0 10px color-mix(in srgb,var(--c) 30%,transparent),0 0 90px color-mix(in srgb,var(--c) 90%,transparent)}
.touch.win .dot::after{animation:winring 1.6s ease-out infinite;inset:-10px;border-width:4px}
@keyframes winring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
#count.pop{animation:cpop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes cpop{0%{transform:scale(1.9);opacity:0}100%{transform:scale(1);opacity:.9}}
#stage.tense::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  animation:vig .8s ease-in-out infinite;
}
@keyframes vig{0%,100%{box-shadow:inset 0 0 40px color-mix(in srgb,var(--glow) 15%,transparent)}50%{box-shadow:inset 0 0 140px color-mix(in srgb,var(--glow) 70%,transparent)}}
#snd{
  position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 14px);z-index:5;
  width:44px;height:44px;border-radius:50%;border:0;font-size:20px;cursor:pointer;
  background:color-mix(in srgb,var(--text) 10%,transparent);color:var(--text);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
</style>
</head>
<body>
<div id="stage">
  <div id="status"></div>
  <div id="center">
    <div class="icon"></div>
    <h1>Finger-Chooser</h1>
    <p>Alle legen einen Finger auf den Bildschirm – einer wird ausgewählt.</p>
  </div>
  <div id="count"></div>
  <button id="snd" aria-label="Ton an oder aus">🔊</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),
      center=document.getElementById('center'),
      status=document.getElementById('status'),
      count=document.getElementById('count');
  var COLORS=['#ff5d8f','#ffb347','#4be3a1','#4bb8ff','#8b6cff','#ff6b4a','#2ee6d6','#c76bff','#a3e635','#f472b6'];
  var touches=new Map(); // pointerId -> {el,x,y,color}
  var state='idle', timer=null, secs=3, colorIdx=0, resetTimer=null;

  function vibrate(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

  /* ---------- Sound (per WebAudio erzeugt, keine Dateien nötig) ---------- */
  var actx=null, muted=false, tension=null;
  function ensureAudio(){
    try{
      if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
      if(actx && actx.state==='suspended') actx.resume();
    }catch(e){}
  }
  function startTension(){
    if(muted||!actx) return;
    stopTension();
    try{
      var t0=actx.currentTime, nodes=[];
      var g=actx.createGain();
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.linearRampToValueAtTime(0.6,t0+0.2);
      g.connect(actx.destination);
      // Steigender Drohnen-Sound
      var f=actx.createBiquadFilter(); f.type='lowpass';
      f.frequency.setValueAtTime(200,t0); f.frequency.exponentialRampToValueAtTime(3000,t0+3);
      f.connect(g);
      var o1=actx.createOscillator(); o1.type='sawtooth';
      o1.frequency.setValueAtTime(65,t0); o1.frequency.exponentialRampToValueAtTime(260,t0+3);
      var g1=actx.createGain(); g1.gain.value=0.14; o1.connect(g1); g1.connect(f); o1.start(t0); o1.stop(t0+3.4);
      var o2=actx.createOscillator(); o2.type='sine';
      o2.frequency.setValueAtTime(130,t0); o2.frequency.exponentialRampToValueAtTime(700,t0+3);
      var g2=actx.createGain(); g2.gain.value=0.07; o2.connect(g2); g2.connect(g); o2.start(t0); o2.stop(t0+3.4);
      nodes.push(o1,o2);
      // Immer schneller werdender Herzschlag
      var t=0.05, gap=0.75, n=0;
      while(t<3){
        var o=actx.createOscillator(); o.type='sine';
        var eg=actx.createGain();
        o.frequency.setValueAtTime(110,t0+t); o.frequency.exponentialRampToValueAtTime(45,t0+t+0.14);
        eg.gain.setValueAtTime(0.0001,t0+t);
        eg.gain.exponentialRampToValueAtTime(0.9,t0+t+0.01);
        eg.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.18);
        o.connect(eg); eg.connect(g); o.start(t0+t); o.stop(t0+t+0.2);
        // heller Tick, der mit jedem Schlag höher wird
        var k=actx.createOscillator(); k.type='triangle';
        var kg=actx.createGain();
        k.frequency.value=900+n*130;
        kg.gain.setValueAtTime(0.0001,t0+t);
        kg.gain.exponentialRampToValueAtTime(0.18,t0+t+0.005);
        kg.gain.exponentialRampToValueAtTime(0.0001,t0+t+0.06);
        k.connect(kg); kg.connect(g); k.start(t0+t); k.stop(t0+t+0.08);
        nodes.push(o,k);
        t+=gap; gap=Math.max(0.17,gap*0.85); n++;
      }
      tension={g:g,nodes:nodes};
    }catch(e){}
  }
  function stopTension(){
    if(!tension||!actx) return;
    try{
      var now=actx.currentTime, tn=tension;
      tn.g.gain.cancelScheduledValues(now);
      tn.g.gain.setValueAtTime(tn.g.gain.value,now);
      tn.g.gain.linearRampToValueAtTime(0.0001,now+0.08);
      tn.nodes.forEach(function(o){ try{ o.stop(now+0.1); }catch(e){} });
    }catch(e){}
    tension=null;
  }
  function playWin(){
    if(muted||!actx) return;
    try{
      var t0=actx.currentTime;
      var g=actx.createGain(); g.gain.value=0.5; g.connect(actx.destination);
      // Bumm
      var b=actx.createOscillator(); b.type='sine';
      var bg=actx.createGain();
      b.frequency.setValueAtTime(140,t0); b.frequency.exponentialRampToValueAtTime(35,t0+0.5);
      bg.gain.setValueAtTime(1,t0); bg.gain.exponentialRampToValueAtTime(0.0001,t0+0.6);
      b.connect(bg); bg.connect(g); b.start(t0); b.stop(t0+0.65);
      // Fanfare (C-Dur-Arpeggio)
      [523.25,659.25,783.99,1046.5,1318.5].forEach(function(fr,i){
        var o=actx.createOscillator(); o.type='triangle'; o.frequency.value=fr;
        var og=actx.createGain(); var s=t0+0.05+i*0.08;
        og.gain.setValueAtTime(0.0001,s);
        og.gain.exponentialRampToValueAtTime(0.35,s+0.02);
        og.gain.exponentialRampToValueAtTime(0.0001,s+0.9);
        o.connect(og); og.connect(g); o.start(s); o.stop(s+0.95);
      });
    }catch(e){}
  }
  function setStatus(t){
    if(t){ status.textContent=t; status.classList.add('show'); } else { status.classList.remove('show'); }
  }
  function pos(el,x,y){ el.style.transform='translate('+x+'px,'+y+'px)'; }

  function nextColor(){
    var used={}; touches.forEach(function(t){ used[t.color]=1; });
    for(var i=0;i<COLORS.length;i++){
      var c=COLORS[(colorIdx+i)%COLORS.length];
      if(!used[c]){ colorIdx=(colorIdx+i+1)%COLORS.length; return c; }
    }
    return COLORS[Math.floor(Math.random()*COLORS.length)];
  }

  function stopTimer(){
    if(timer){ clearInterval(timer); timer=null; }
    count.classList.remove('show','pop');
    stage.classList.remove('tense');
    stopTension();
  }
  function popCount(){
    count.classList.remove('pop'); void count.offsetWidth; count.classList.add('pop');
  }

  function startCountdown(){
    stopTimer(); secs=3;
    state='counting';
    setStatus('Gleich geht’s los …');
    count.textContent=secs; count.classList.add('show'); popCount();
    stage.classList.add('tense');
    startTension();
    timer=setInterval(function(){
      secs--;
      if(secs<=0){ stopTimer(); choose(); }
      else { count.textContent=secs; popCount(); vibrate(25); }
    },1000);
  }

  function update(){
    if(state==='done') return;
    var n=touches.size;
    center.classList.toggle('hide', n>0);
    if(n>=2){ startCountdown(); }
    else{
      stopTimer(); state='idle';
      setStatus(n===1?'Noch jemand fehlt …':'');
    }
  }

  function choose(){
    var arr=Array.from(touches.values());
    if(arr.length<2){ update(); return; }
    var win=arr[Math.floor(Math.random()*arr.length)];
    state='done';
    arr.forEach(function(t){ t.el.classList.add(t===win?'win':'lose'); });
    stage.style.setProperty('--wc',win.color);
    stage.style.setProperty('--wx',win.x+'px');
    stage.style.setProperty('--wy',win.y+'px');
    stage.classList.add('done');
    setStatus('Du bist dran!');
    vibrate([60,40,120]);
    playWin();
    if(touches.size===0) scheduleReset();
  }

  function scheduleReset(){
    clearTimeout(resetTimer);
    resetTimer=setTimeout(reset,900);
  }
  function reset(){
    clearTimeout(resetTimer);
    stopTimer();
    touches.forEach(function(t){ t.el.remove(); });
    touches.clear();
    stage.querySelectorAll('.touch').forEach(function(e){ e.remove(); });
    stage.classList.remove('done');
    state='idle';
    setStatus('');
    center.classList.remove('hide');
  }

  stage.addEventListener('pointerdown',function(e){
    e.preventDefault();
    ensureAudio();
    if(state==='done'){ return; }
    if(touches.has(e.pointerId)) return;
    var el=document.createElement('div');
    el.className='touch';
    var color=nextColor();
    el.style.setProperty('--c',color);
    el.innerHTML='<div class="dot"></div>';
    pos(el,e.clientX,e.clientY);
    stage.appendChild(el);
    touches.set(e.pointerId,{el:el,x:e.clientX,y:e.clientY,color:color});
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    vibrate(10);
    update();
  });
  stage.addEventListener('pointermove',function(e){
    var t=touches.get(e.pointerId);
    if(!t) return;
    t.x=e.clientX; t.y=e.clientY;
    pos(t.el,t.x,t.y);
  });
  function up(e){
    var t=touches.get(e.pointerId);
    if(!t) return;
    touches.delete(e.pointerId);
    if(state==='done'){
      if(!t.el.classList.contains('win')) t.el.remove();
      // Gewinner bleibt sichtbar, bis alle Finger weg sind
      if(touches.size===0){ scheduleReset(); }
      else {
        var won=Array.from(touches.values()).some(function(x){return x.el.classList.contains('win');});
        if(!won){ scheduleReset(); }
      }
      // Falls der Gewinnerfinger losgelassen wird, bleibt der Punkt kurz stehen
      if(t.el.classList.contains('win')){ scheduleResetIfNone(); }
      return;
    }
    t.el.style.transition='opacity .25s';
    t.el.style.opacity='0';
    setTimeout(function(){ t.el.remove(); },250);
    update();
  }
  function scheduleResetIfNone(){
    // Nach dem Loslassen des Gewinners kurz zeigen, dann zurücksetzen
    clearTimeout(resetTimer);
    resetTimer=setTimeout(reset,1800);
  }
  stage.addEventListener('pointerup',up);
  stage.addEventListener('pointercancel',up);
  var snd=document.getElementById('snd');
  snd.addEventListener('pointerdown',function(e){ e.stopPropagation(); });
  snd.addEventListener('pointerup',function(e){ e.stopPropagation(); });
  snd.addEventListener('click',function(e){
    e.stopPropagation();
    muted=!muted;
    snd.textContent=muted?'🔇':'🔊';
    if(muted) stopTension(); else ensureAudio();
  });
  stage.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
  stage.addEventListener('dblclick',function(e){ e.preventDefault(); });
})();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
